<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>利率债观察</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#192437;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:640px;margin:auto;padding:28px 16px 36px}header{display:flex;justify-content:space-between;align-items:center}.e{font-size:10px;letter-spacing:1.4px;color:#758397;margin:0 0 5px}h1{font-size:27px;margin:0}button{border:0;border-radius:50%;width:38px;height:38px;background:#182a42;color:white;font-size:24px}.sub,small{color:#78869a;font-size:11px}.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #1b2b3c0b}.head{display:flex;justify-content:space-between;font-size:15px;font-weight:700}.head em{font-style:normal;color:#8793a4;font-size:11px;font-weight:400}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:14px}.grid b{display:block;font-size:12px}.grid span{display:block;color:#7d8998;font-size:10px;margin-top:4px}.yield{display:flex;gap:12px;align-items:baseline;margin-top:14px}.yield strong{font-size:34px}.up{color:#c24c42}.down{color:#159076}.range{display:flex;justify-content:space-between;color:#758397;font-size:11px;margin-top:12px}.spark{width:100%;height:78px;margin-top:9px}.spark polyline{fill:none;stroke:#c24c42;stroke-width:2.2}.row{display:flex;justify-content:space-between;border-top:1px solid #edf0f4;padding:11px 0;gap:8px}.row b{font-size:13px}.right{text-align:right}.note{font-size:12px;line-height:1.75;color:#4f5c6c;margin:10px 0 0}.empty{font-size:12px;color:#8894a3;padding:12px 0}footer{text-align:center;color:#a0a9b6;font-size:10px;margin-top:22px}</style><body><main><header><div><p class="e">DM MCP · BOND DASHBOARD</p><h1>利率债观察</h1></div><button onclick="load()">↻</button></header><p class="sub" id="sub">加载中…</p><div id="error"></div><section class="card"><div class="head"><span>市场温度 · 中债国债曲线</span><em id="mdate">--</em></div><div class="grid" id="market"></div><div class="range" id="spread"></div></section><section class="card"><div class="head"><span>国债 10Y 收益率</span><em>近三个月</em></div><div class="yield"><strong id="yield">--</strong><span id="change"></span></div><svg class="spark" viewBox="0 0 100 60" preserveAspectRatio="none"><polyline id="line"/></svg><div class="range"><span id="first">--</span><span id="last">--</span></div><div class="range" id="stats"></div></section><section class="card"><div class="head"><span>国债一级发行</span><em>最近 7 天</em></div><div id="issues"></div></section><section class="card"><div class="head"><span>资金日历</span><em>最近 7 天</em></div><div id="cal"></div></section><section class="card"><div class="head"><span>日度总结</span><em id="sdate">--</em></div><div class="note" id="summary"></div></section><footer>数据为最新可得 DM 估值/公告日期，非盘中实时成交；仅供参考，不构成投资建议</footer></main><script>const f=(x,d=2)=>typeof x==='number'?x.toLocaleString('zh-CN',{maximumFractionDigits:d}):'--',row=(a,fn,e)=>a?.length?a.map(fn).join(''):`<div class="empty">${e}</div>`;async function load(){try{let r=await fetch('data.json?'+Date.now()),d=await r.json();if(d.error)throw Error(d.error);sub.textContent=`页面读取：${new Date().toLocaleString('zh-CN')} · 数据截至 ${d.as_of}`;let m=d.market_snapshot||{},t=m.terms||{};mdate.textContent=`数据日期：${m.date||'--'}`;market.innerHTML=['1','3','5','7','10'].map(k=>`<div><b>${k}Y</b><span>${typeof t[k]==='number'?t[k].toFixed(3)+'%':'--'}</span></div>`).join('');spread.innerHTML=`<span>10Y-1Y：${typeof m.spread_10_1==='number'?(m.spread_10_1*100).toFixed(1)+' bp':'--'}</span><span>10Y-5Y：${typeof m.spread_10_5==='number'?(m.spread_10_5*100).toFixed(1)+' bp':'--'}</span>`;let c=d.ten_year_yield_curve.filter(x=>typeof x.yield==='number'),z=c.at(-1),chg=z&&c[0]?(z.yield-c[0].yield)*100:null;yield.textContent=z?z.yield.toFixed(3)+'%':'--';change.textContent=chg==null?'':`${chg>=0?'+':''}${chg.toFixed(1)} bp`;change.className=chg>=0?'up':'down';first.textContent=c[0]?.date||'--';last.textContent=z?.date||'--';let v=c.map(x=>x.yield),lo=Math.min(...v),hi=Math.max(...v),sp=hi-lo||1;line.setAttribute('points',v.map((x,i)=>`${i/(v.length-1)*100},${52-(x-lo)/sp*44}`).join(' '));let st=d.ten_year_stats||{};stats.innerHTML=`<span>区间低点 ${f(st.low,3)}%</span><span>区间高点 ${f(st.high,3)}%</span><span>当前分位 ${f(st.percentile,1)}%</span>`;issues.innerHTML=row(d.treasury_issues,x=>`<div class="row"><div><b>${x.name||'国债'} / ${x.tenor||'--'}Y</b><br><small>${x.date||'--'}</small></div><div class="right"><b>${f(x.amount)} 亿</b><br><small>利率 ${f(x.yield,3)}% · ${f(x.multiple,2)}倍</small></div></div>`,'本周暂无已公布记录');cal.innerHTML=row(d.fund_calendar,x=>`<div class="row"><div><b>${x.date}</b><br><small>公开市场净投放</small></div><div class="right"><b class="${(x.omo_net||0)>=0?'up':'down'}">${(x.omo_net||0)>=0?'+':''}${f(x.omo_net)} 亿</b><br><small>政府债净缴款 ${f(x.gov_net)} 亿</small></div></div>`,'暂无数据');sdate.textContent=`参考：${m.date||d.as_of}`;summary.innerHTML=`• 10Y 国债收益率为 ${f(z?.yield,3)}%，处于近三个月 ${f(st.percentile,1)}% 分位。<br>• 10Y-1Y 利差 ${typeof m.spread_10_1==='number'?(m.spread_10_1*100).toFixed(1):'--'} bp，曲线${m.spread_10_1>0?'维持正斜率':'形态待观察'}。<br>• 本周国债一级发行 ${d.treasury_issues?.length||0} 笔；结合资金日历关注招标与缴款日。`}catch(e){error.innerHTML=`<div class="empty">数据暂不可用：${e.message}</div>`}}load()</script></body></html>
