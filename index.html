<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>利率债观察</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#192437;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:640px;margin:auto;padding:28px 16px 38px}header{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:10px;letter-spacing:1.4px;color:#758397;margin:0 0 5px}h1{font-size:27px;margin:0}button{border:0;border-radius:50%;width:38px;height:38px;background:#182a42;color:#fff;font-size:24px}.sub{color:#78869a;font-size:12px;margin:12px 0 22px}.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #1b2b3c0b}.head{display:flex;justify-content:space-between;font-size:15px;font-weight:700}.head em{font-style:normal;color:#8793a4;font-size:12px;font-weight:400}.yield{display:flex;align-items:baseline;gap:12px;margin-top:14px}.yield strong{font-size:35px;letter-spacing:-1px}.yield small{font-size:17px;margin-left:3px}.up{color:#c24c42}.down{color:#159076}.spark{width:100%;height:82px;margin:9px 0 0}.spark polyline{fill:none;stroke:#ca4d3e;stroke-width:2.2}.range{display:flex;justify-content:space-between;color:#97a1af;font-size:10px}.row{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid #eef1f4;gap:12px}.row b{display:block;font-size:13px}.row small{display:block;color:#8995a5;font-size:11px;margin-top:5px}.right{text-align:right}.empty{color:#8995a5;font-size:13px;padding:16px 0}footer{text-align:center;color:#a1aab7;font-size:10px;margin:25px 0 0}.error{background:#fff0ed;color:#a8463f;padding:12px;border-radius:10px;font-size:12px;margin-bottom:12px}</style></head><body><main><header><div><p class="eyebrow">DM MCP · BOND DASHBOARD</p><h1>利率债观察</h1></div><button onclick="load()">↻</button></header><p class="sub" id="sub">正在加载数据…</p><div id="error"></div><section class="card"><div class="head"><span>国债 10Y 收益率</span><em>近 3 个月</em></div><div class="yield"><strong id="yield">--<small>%</small></strong><span id="change"></span></div><svg class="spark" viewBox="0 0 100 60" preserveAspectRatio="none"><polyline id="line"/></svg><div class="range"><span id="start">--</span><span id="end">--</span></div></section><section class="card"><div class="head"><span>国债一级发行</span><em>近一周</em></div><div id="issues"></div></section><section class="card"><div class="head"><span>资金日历</span><em>最近 7 天</em></div><div id="calendar"></div></section><footer>仅供信息参考，不构成投资建议</footer></main><script>const n=(v,d=2)=>typeof v==='number'?v.toLocaleString('zh-CN',{maximumFractionDigits:d}):'--';const rows=(id,a,fn,empty)=>document.querySelector(id).innerHTML=a?.length?a.map(fn).join(''):`<div class="empty">${empty}</div>`;async function load(){try{let r=await fetch('data.json?'+Date.now()),d=await r.json();if(d.error)throw Error(d.error);document.querySelector('#sub').textContent=`数据截至 ${d.as_of} · GitHub 每小时自动更新`;let c=d.ten_year_yield_curve.filter(x=>typeof x.yield==='number'),last=c.at(-1),chg=last&&c[0]?(last.yield-c[0].yield)*100:null;document.querySelector('#yield').innerHTML=`${n(last?.yield,3)}<small>%</small>`;let x=document.querySelector('#change');x.textContent=chg==null?'':`${chg>=0?'+':''}${chg.toFixed(1)} bp`;x.className=chg>=0?'up':'down';document.querySelector('#start').textContent=c[0]?.date||'--';document.querySelector('#end').textContent=last?.date||'--';let vs=c.map(x=>x.yield),mi=Math.min(...vs),ma=Math.max(...vs),span=ma-mi||1;document.querySelector('#line').setAttribute('points',vs.map((v,i)=>`${i/(vs.length-1)*100},${52-(v-mi)/span*44}`).join(' '));rows('#issues',d.treasury_issues,x=>`<div class="row"><div><b>${x.name||'国债'}</b><small>${x.date||'--'} · ${x.tenor||'--'}年</small></div><div class="right"><b>${n(x.amount)} 亿</b><small>利率 ${n(x.yield,3)}%</small></div></div>`,'本周暂无已公布的国债发行记录');rows('#calendar',d.fund_calendar,x=>`<div class="row"><div><b>${x.date}</b><small>公开市场净投放</small></div><div class="right"><b class="${(x.omo_net||0)>=0?'up':'down'}">${(x.omo_net||0)>=0?'+':''}${n(x.omo_net)} 亿</b><small>政府债净缴款 ${n(x.gov_net)} 亿</small></div></div>`,'暂无资金日历数据')}catch(e){document.querySelector('#error').innerHTML=`<div class="error">数据暂不可用：${e.message}</div>`}}load()</script></body></html>
