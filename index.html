<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>利率债观察</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#192437;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:640px;margin:auto;padding:28px 16px 36px}header{display:flex;justify-content:space-between;align-items:center}.e{font-size:10px;letter-spacing:1.4px;color:#758397;margin:0 0 5px}h1{font-size:27px;margin:0}button{border:0;border-radius:50%;width:38px;height:38px;background:#182a42;color:#fff;font-size:24px}.sub,small{color:#78869a;font-size:11px}.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #1b2b3c0b}.head{display:flex;justify-content:space-between;font-size:15px;font-weight:700}.head em{font-style:normal;color:#8793a4;font-size:11px;font-weight:400}.yield{display:flex;gap:12px;align-items:baseline;margin-top:14px}.yield strong{font-size:34px}.up{color:#c24c42}.down{color:#159076}.range{display:flex;justify-content:space-between;color:#758397;font-size:11px;margin-top:12px}.spark{width:100%;height:78px;margin-top:9px}.spark polyline{fill:none;stroke:#c24c42;stroke-width:2.2}.row{display:flex;justify-content:space-between;border-top:1px solid #edf0f4;padding:11px 0;gap:8px}.row b{font-size:13px}.right{text-align:right}.note{font-size:12px;line-height:1.75;color:#4f5c6c;margin:10px 0 0}.empty{font-size:12px;color:#8894a3;padding:12px 0}footer{text-align:center;color:#a0a9b6;font-size:10px;margin-top:22px}</style><body><main><header><div><p class="e">DM MCP · BOND DASHBOARD</p><h1>利率债观察</h1></div><button onclick="load()">↻</button></header><p class="sub" id="sub">加载中…</p><section class="card"><div class="head"><span>国债 10Y 收益率</span><em>近三个月</em></div><div class="yield"><strong id="y">--</strong><span id="ch"></span></div><svg class="spark" viewBox="0 0 100 60" preserveAspectRatio="none"><polyline id="l"/></svg><div class="range"><span id="a">--</span><span id="b">--</span></div></section><section class="card"><div class="head"><span>国债一级发行</span><em>最近 7 天</em></div><div id="i"></div></section><section class="card"><div class="head"><span>政府债缴款日历</span><em>最近 7 天</em></div><div id="c"></div></section><section class="card"><div class="head"><span>日度总结</span><em id="d">--</em></div><div class="note" id="s"></div></section><footer>数据为最新可得 DM 估值/公告日期，非盘中实时成交；仅供参考，不构成投资建议</footer></main><script>const n=x=>typeof x==='number'?x.toLocaleString('zh-CN',{maximumFractionDigits:2}):'--';async function load(){let d=await(await fetch('data.json?'+Date.now())).json();sub.textContent=`页面读取：${new Date().toLocaleString('zh-CN')} · 数据截至 ${d.as_of}`;let q=d.ten_year_yield_curve.filter(x=>typeof x.yield==='number'),z=q.at(-1),k=z&&q[0]?(z.yield-q[0].yield)*100:null;y.textContent=z?z.yield.toFixed(3)+'%':'--';ch.textContent=k==null?'':`${k>=0?'+':''}${k.toFixed(1)} bp`;ch.className=k>=0?'up':'down';a.textContent=q[0]?.date||'--';b.textContent=z?.date||'--';let v=q.map(x=>x.yield),lo=Math.min(...v),hi=Math.max(...v),sp=hi-lo||1;l.setAttribute('points',v.map((x,j)=>`${j/(v.length-1)*100},${52-(x-lo)/sp*44}`).join(' '));i.innerHTML=(d.treasury_issues||[]).map(x=>`<div class="row"><div><b>${x.name||'国债'} / ${x.tenor||'--'}Y</b><br><small>${x.date||'--'}</small></div><div class="right"><b>${n(x.amount)} 亿</b><br><small>利率 ${n(x.yield)}%</small></div></div>`).join('')||'<div class="empty">暂无数据</div>';c.innerHTML=(d.fund_calendar||[]).map(x=>`<div class="row"><div><b>${x.date}</b><br><small>政府债净缴款</small></div><div class="right"><b>${n(x.gov_net)} 亿</b></div></div>`).join('')||'<div class="empty">暂无数据</div>';d=document.querySelector('#d');d.textContent=`参考：${d.as_of||'--'}`;s.innerHTML=`• 当前 10Y 收益率 ${z?z.yield.toFixed(3)+'%':'--'}，数据日期 ${z?.date||'--'}。<br>• 最近 7 天国债一级发行 ${d.treasury_issues?.length||0} 笔。<br>• 政府债缴款按 DM 最新可得公告日展示。`}load()</script></body></html>
